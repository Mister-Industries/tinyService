# Builds the tinyService tray-agent Windows installer and publishes it to
# GitHub Releases.
#
# Trigger: push a tag like `agent-v1.0.0` (or run manually from the Actions
# tab — manual runs build the installer as a CI artifact without releasing).
# The published asset keeps the stable name `tinyService-Setup.exe`, so the
# website / tinyStudio can always link:
#
#   https://github.com/Mister-Industries/tinyService/releases/latest/download/tinyService-Setup.exe
#
# Note: electron-builder itself only BUILDS (--publish never). Its own GitHub
# publisher derives the tag from package.json ("v1.0.0"), which never matches
# our agent-v* tags and makes the API reject the release ("Published releases
# must have a valid tag"). The release step below uses the real pushed tag.

name: Release tinyService Agent

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared + service packages
        run: |
          npm run build:shared
          npm run build:service

      - name: Fetch arduino-cli (bundled into installer)
        run: node packages/agent/scripts/fetch-arduino-cli.mjs windows-x64

      - name: Bundle agent main process
        run: npm run build --workspace=packages/agent

      - name: Build installer
        working-directory: packages/agent
        run: npx electron-builder --win --publish never

      - name: Publish GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          name: tinyService Agent ${{ github.ref_name }}
          files: packages/agent/release/tinyService-Setup.exe
          fail_on_unmatched_files: true

      # Manual runs (and tag runs) also keep the installer as a CI artifact.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyService-Setup
          path: packages/agent/release/tinyService-Setup.exe
